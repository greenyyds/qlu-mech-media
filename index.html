<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="齐鲁工业大学机械工程学部全媒体部门内部工作台：整合常用链接、本周任务规划与新闻初稿生成工具。"
    />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="icon" type="image/webp" href="./dept-logo.webp" />
    <title>机械工程学部全媒体工作台</title>
    <script>
      // 首帧前应用已保存的主题，避免深色模式闪烁（防 FOUC）
      ;(function () {
        try {
          var t = localStorage.getItem('qlu-mech-media:theme:v1') || 'system'
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
